name: Publish Unmeshed API Common

on:
  workflow_dispatch:
  push:
    branches: ['release']
  release:
    types:
      - published

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION:            ${{ secrets.AWS_REGION }}
      MAVEN_USERNAME:        ${{ secrets.OSSRH_USERNAME }}
      MAVEN_CENTRAL_TOKEN:   ${{ secrets.OSSRH_PASSWORD }}
      MAVEN_GPG_KEY:         ${{ secrets.GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE:  ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java and Maven server creds
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          server-id: ossrh
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_CENTRAL_TOKEN

      - name: Verify GPG signing inputs
        run: test -n "$MAVEN_GPG_KEY" && test -n "$MAVEN_GPG_PASSPHRASE"

      - name: Package Common
        run: mvn --batch-mode -f unmeshed-api-common/pom.xml clean deploy

      - name: List all files
        run: find .
